<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Kamarieri</title>
  <link rel="stylesheet" href="/css/waiter.css">
</head>
<body>
  <div id="screen-pin" class="screen active">
    <div class="waiter-header">
      <h1 id="login-title">Kamarieri</h1>
      <div class="sub" id="login-sub">Shkruani PIN-in tuaj (4 shifra)</div>
    </div>
    <div class="waiter-main">
      <div class="login-box pin-box">
        <div id="login-err" class="err hidden"></div>
        <div id="pin-display" class="pin-display" aria-live="polite">••••</div>
        <div class="pin-keypad" id="pin-keypad">
          <button type="button" class="pin-key" data-digit="1">1</button>
          <button type="button" class="pin-key" data-digit="2">2</button>
          <button type="button" class="pin-key" data-digit="3">3</button>
          <button type="button" class="pin-key" data-digit="4">4</button>
          <button type="button" class="pin-key" data-digit="5">5</button>
          <button type="button" class="pin-key" data-digit="6">6</button>
          <button type="button" class="pin-key" data-digit="7">7</button>
          <button type="button" class="pin-key" data-digit="8">8</button>
          <button type="button" class="pin-key" data-digit="9">9</button>
          <button type="button" class="pin-key pin-key-muted" id="pin-clear">C</button>
          <button type="button" class="pin-key" data-digit="0">0</button>
          <button type="button" class="pin-key pin-key-muted" id="pin-back">⌫</button>
        </div>
        <button type="button" class="btn btn-primary pin-submit" id="btn-pin-login">Hyr</button>
        <p class="hint" id="sync-hint"></p>
      </div>
    </div>
  </div>

  <div id="screen-tables" class="screen">
    <div class="waiter-header">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem">
        <div>
          <h1 id="tables-title">Tavolinat</h1>
          <div class="sub" id="tables-waiter"></div>
        </div>
        <button type="button" class="btn btn-ghost" id="btn-logout">Kyçu</button>
      </div>
    </div>
    <div class="waiter-main">
      <div id="tables-err" class="err hidden"></div>
      <div id="tables-grid" class="tables-grid"></div>
    </div>
  </div>

  <div id="screen-order" class="screen">
    <div class="waiter-header">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:0.5rem">
        <button type="button" class="btn btn-ghost" id="btn-back">← Tavolinat</button>
        <h1 id="order-title" style="margin:0;font-size:1.1rem">T1</h1>
        <span id="cart-badge" class="cart-badge hidden">0</span>
      </div>
    </div>
    <div class="waiter-main order-main">
      <div id="order-err" class="err hidden"></div>
      <div class="order-layout">
        <div id="cat-tabs" class="cat-tabs"></div>
        <div id="menu-grid" class="menu-grid"></div>
      </div>
    </div>
    <div id="cart-bar" class="cart-bar hidden" aria-live="polite">
      <div class="cart-bar-head">
        <span class="cart-bar-title">🛒 Shporta</span>
        <span id="cart-count-label" class="cart-count-label">0 artikuj</span>
      </div>
      <div id="cart-lines" class="cart-lines"></div>
      <div class="cart-total">
        <span>Totali</span>
        <span id="cart-total">0.00 €</span>
      </div>
      <div id="cart-msg" class="cart-msg hidden"></div>
      <button type="button" class="btn btn-send-order" id="btn-send">Dërgo Porosinë</button>
      <button type="button" class="btn btn-close btn-close-secondary" id="btn-close">Mbyll tavolinën + Printo faturën</button>
    </div>
  </div>

  <div id="success-toast" class="success-toast hidden" role="status" aria-live="polite"></div>

  <div id="receipt-modal" class="receipt-modal hidden">
    <div class="receipt-sheet" id="receipt-print"></div>
    <div class="receipt-actions no-print">
      <button type="button" class="btn btn-primary" id="btn-print">Printo</button>
      <button type="button" class="btn btn-ghost" id="btn-receipt-done">Mbyll</button>
    </div>
  </div>

  <div id="lock-overlay" class="lock-overlay hidden" aria-live="assertive">
    <div class="lock-overlay-box">
      <p id="lock-countdown">Duke u kyçur në 5...</p>
    </div>
  </div>

  <script src="/js/menuCatalog.js?v=1"></script>
  <script src="/js/waiter.js?v=8"></script>
</body>
</html>
