<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1a1208">
  <title>Banak — Porosi</title>
  <link rel="stylesheet" href="/css/bar.css">
</head>
<body>
  <header class="bar-header">
    <h1 id="bar-title">Banak</h1>
    <div class="sub" id="bar-sub">Porosi nga kamarieri dhe tavolina — jo faturë</div>
    <div class="bar-meta">
      <span class="live-dot" id="live-label">Live</span>
      <span id="order-count">0 porosi</span>
      <span id="last-sync">—</span>
    </div>
  </header>

  <main class="bar-main">
    <div id="error-box" class="error-state hidden"></div>
    <div id="orders-grid" class="orders-grid"></div>
    <div id="empty-state" class="empty-state hidden">
      <div class="icon">🍹</div>
      <p>Nuk ka porosi të reja.<br>Pritni porosinë nga kamarieri ose tavolina.</p>
    </div>
  </main>

  <script src="/js/bar.js"></script>
</body>
</html>
