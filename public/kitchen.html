<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0c1220">
  <title>Kuzhina — KDS</title>
  <link rel="stylesheet" href="/css/kitchen.css">
</head>
<body>
  <header class="kitchen-header">
    <h1 id="kitchen-title">Kuzhina</h1>
    <div class="sub" id="kitchen-sub">Duke ngarkuar porositë...</div>
    <div class="kitchen-meta">
      <span class="live-dot" id="live-label">Live</span>
      <span id="order-count">0 porosi</span>
      <span id="last-sync">—</span>
    </div>
  </header>

  <main class="kitchen-main">
    <div id="error-box" class="error-state hidden"></div>
    <div id="orders-grid" class="orders-grid"></div>
    <div id="empty-state" class="empty-state hidden">
      <div class="icon">🍽️</div>
      <p>Nuk ka porosi të reja.<br>Pritni porosinë nga POS.</p>
    </div>
  </main>

  <script src="/js/kitchen.js"></script>
</body>
</html>
