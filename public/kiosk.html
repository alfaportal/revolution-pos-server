<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f1b3d">
  <link rel="icon" type="image/png" href="/logo-source.png">
  <title>Tavolinë — Revolution Invest POS</title>
  <link rel="stylesheet" href="/css/staff-brand.css">
  <link rel="stylesheet" href="/css/waiter.css">
  <style>
    .kiosk-badge {
      display: inline-block;
      margin-top: 0.35rem;
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .kiosk-hint {
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
      margin: 0.5rem 0 0;
      line-height: 1.4;
    }
    /* Scroll i plotë i menusë në telefon — shporta fikse poshtë */
    body.kiosk-body {
      height: 100dvh;
      overflow: hidden;
    }
    #screen-order.kiosk-screen {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
    }
    #screen-order.kiosk-screen .waiter-main.order-main {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding-bottom: var(--kiosk-cart-height, 12rem);
    }
    #screen-order.kiosk-screen .menu-pos-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    #screen-order.kiosk-screen .menu-photo-grid {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
    }
    #screen-order.kiosk-screen .menu-photo-grid-inner {
      padding-bottom: 1rem;
    }
    .cancel-order-bar {
      padding: 0.75rem;
      margin-bottom: 0.65rem;
      border-radius: 12px;
      background: rgba(34, 197, 94, 0.12);
      border: 2px solid var(--ok);
      text-align: center;
    }
    .cancel-order-bar.hidden { display: none; }
    .cancel-order-bar p { margin: 0 0 0.5rem; font-weight: 700; }
    .cancel-order-bar .btn-cancel-order {
      width: 100%;
      min-height: 48px;
      border: none;
      border-radius: 10px;
      background: #991b1b;
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
    }
    .cancel-order-bar .cancel-countdown {
      margin: 0.45rem 0 0;
      font-size: 0.82rem;
      color: var(--muted);
    }
  </style>
</head>
<body class="kiosk-body">
  <div id="screen-order" class="screen active kiosk-screen">
    <div class="staff-app-bar">
      <img src="/logo-source.png" width="28" height="28" alt="Revolution Invest POS">
      <span>Revolution Invest POS</span>
      <span class="staff-app-venue" id="kiosk-venue-name">Tavolinë</span>
    </div>
    <div class="waiter-header">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:0.5rem">
        <div>
          <h1 id="kiosk-title" style="margin:0;font-size:1.1rem">Tavolinë</h1>
          <div class="kiosk-badge" id="kiosk-table-label">T—</div>
        </div>
      </div>
      <p class="kiosk-hint" id="sync-hint">Porosia shkon te banaku — jo faturë.</p>
    </div>
    <div class="waiter-main order-main">
      <div id="order-err" class="err hidden"></div>
      <div class="order-layout menu-pos-wrap">
        <div class="menu-group-bar" id="menu-group-bar">
          <button type="button" class="menu-group-btn active" data-group="pije">Pije 🥤</button>
          <button type="button" class="menu-group-btn" data-group="ushqim">Ushqim 🍽️</button>
        </div>
        <div id="menu-grid" class="menu-photo-grid"></div>
      </div>
    </div>
    <div id="cart-bar" class="cart-bar">
      <div id="cancel-order-bar" class="cancel-order-bar hidden">
        <p id="cancel-order-msg">Porosia u dërgua.</p>
        <button type="button" class="btn-cancel-order" id="btn-cancel-order">Anullo Porosinë</button>
        <p class="cancel-countdown" id="cancel-countdown"></p>
      </div>
      <div id="cart-lines" class="cart-lines"></div>
      <div class="cart-total">
        <span>Totali</span>
        <span id="cart-total">0.00 €</span>
      </div>
      <div class="cart-actions">
        <button type="button" class="btn btn-primary" id="btn-send">Dërgo porosinë te banaku</button>
      </div>
    </div>
  </div>

  <script src="/js/menuCatalog.js?v=1"></script>
  <script src="/js/menu-pos.js?v=1"></script>
  <script src="/js/kiosk.js?v=7"></script>
</body>
</html>
