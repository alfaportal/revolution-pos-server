<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Tavolinë — Porosi</title>
  <link rel="stylesheet" href="/css/waiter.css">
  <style>
    .kiosk-badge {
      display: inline-block;
      margin-top: 0.35rem;
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      font-size: 0.78rem;
      font-weight: 700;
    }
    .kiosk-hint {
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
      margin: 0.5rem 0 0;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="screen-order" class="screen active">
    <div class="waiter-header">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:0.5rem">
        <div>
          <h1 id="kiosk-title" style="margin:0;font-size:1.1rem">Tavolinë</h1>
          <div class="kiosk-badge" id="kiosk-table-label">T—</div>
        </div>
      </div>
      <p class="kiosk-hint" id="sync-hint">Porosia shkon te banaku — jo faturë.</p>
    </div>
    <div class="waiter-main" style="padding-bottom:0">
      <div id="order-err" class="err hidden"></div>
      <div class="order-layout">
        <div id="cat-tabs" class="cat-tabs"></div>
        <div id="menu-grid" class="menu-grid"></div>
      </div>
    </div>
    <div class="cart-bar">
      <div id="cart-lines" class="cart-lines"></div>
      <div class="cart-total">
        <span>Totali</span>
        <span id="cart-total">0.00 €</span>
      </div>
      <div class="cart-actions">
        <button type="button" class="btn btn-primary" id="btn-send">Dërgo porosinë te banaku</button>
      </div>
    </div>
  </div>

  <script src="/js/kiosk.js"></script>
</body>
</html>
