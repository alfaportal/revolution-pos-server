<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Hyrje — Revolution POS Pronar</title>
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RI POS">
  <link rel="manifest" href="/owner/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/owner.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Paneli i pronarit</h1>
      <p>Shikoni shitjet dhe raportet e restorantit/kafenes tuaj nga telefoni.</p>
      <div id="login-error" class="alert alert-error hidden"></div>
      <form id="form-login">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" placeholder="pronari@restorant.com">
        <label for="password">Fjalëkalimi</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:0.5rem">Hyr</button>
      </form>
    </div>
  </div>
  <script>
    (async () => {
      const token = localStorage.getItem("owner_token");
      if (!token) return;
      try {
        const res = await fetch("/api/auth/owner/me", {
          headers: { Authorization: `Bearer ${token}` },
          credentials: "include",
        });
        if (res.ok) {
          location.href = "/owner/panel";
          return;
        }
        localStorage.removeItem("owner_token");
      } catch {
        localStorage.removeItem("owner_token");
      }
    })();

    (function prefillEmailFromQr() {
      const params = new URLSearchParams(location.search);
      const email = params.get("email");
      if (!email) return;
      const input = document.getElementById("email");
      input.value = email.trim();
      document.getElementById("password").focus();
    })();

    document.getElementById("form-login").addEventListener("submit", async e => {
      e.preventDefault();
      const errEl = document.getElementById("login-error");
      errEl.classList.add("hidden");
      try {
        const res = await fetch("/api/auth/owner/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.gabim || "Gabim");
        localStorage.setItem("owner_token", data.token);
        location.href = "/owner/panel";
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
