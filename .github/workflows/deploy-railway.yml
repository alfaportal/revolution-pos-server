name: Deploy to Railway

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: railway-deploy-restaurant
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_DEPLOY_HOOK: ${{ secrets.RAILWAY_DEPLOY_HOOK }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: |
          set -e
          if [ -n "$RAILWAY_DEPLOY_HOOK" ]; then
            echo "Triggering Railway deploy hook…"
            curl -fsS -X POST "$RAILWAY_DEPLOY_HOOK"
            exit 0
          fi
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "Deploying with Railway CLI…"
            if [ -n "$RAILWAY_SERVICE" ]; then
              railway up --detach --service "$RAILWAY_SERVICE"
            else
              railway up --detach
            fi
            exit 0
          fi
          echo "::warning::Shto RAILWAY_DEPLOY_HOOK ose RAILWAY_TOKEN te GitHub Secrets (Settings → Secrets → Actions)."
          exit 1
